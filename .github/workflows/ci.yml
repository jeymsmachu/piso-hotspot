name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The toolchain comes from rust-toolchain.toml; the action only
      # installs it (components included) and caches it for the run.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 1.98.1
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked

  # Dependency advisories, licences, and registry hygiene. The policy is
  # in deny.toml: a yanked crate or an unknown source fails the build.
  deny:
    name: Dependencies (${{ matrix.check }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [advisories, licenses, bans, sources]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-deny
      - name: cargo deny ${{ matrix.check }}
        run: cargo deny check ${{ matrix.check }}

  # The prompt says "the paywall must fail closed". This is the only job
  # that can prove it: a real kernel, real nftables, real traffic, inside
  # throwaway network namespaces.
  kernel:
    name: Kernel enforcement (namespaces)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 1.98.1
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: kernel-${{ github.ref }}
      - name: Install the tools the daemon drives
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nftables iproute2 iputils-ping
      # Built as the runner user, then executed as root: running cargo
      # itself under sudo would leave root-owned files in target/.
      - name: Build the test binary
        run: cargo test --locked --no-run
      - name: Run the namespace test as root
        run: |
          set -euo pipefail
          cargo test --locked --no-run --message-format=json 2>/dev/null \
            | jq -r 'select(.target.name == "piso-hotspot") | .executable // empty' \
            | tail -1 > /tmp/piso-test-bin
          BIN="$(cat /tmp/piso-test-bin)"
          test -x "$BIN"
          sudo "$BIN" netns --nocapture --test-threads=1

  # Secrets never belong in a repository; this fails the build when one
  # is committed, before it reaches a release artifact.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: gitleaks
      - name: Scan the history
        run: gitleaks detect --source . --redact --verbose --exit-code 1

  # Packaging is verified here (and published by release.yml) so a broken
  # Cargo.toml metadata block fails on the PR, not at release time.
  package:
    name: Package (${{ matrix.triple }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 keeps the glibc floor low for the x86-64 artifact.
          - runner: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 1.98.1
        with:
          toolchain: "1.98.1"
          targets: ${{ matrix.triple }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: package-${{ matrix.triple }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.triple }}
      - name: Provide the path package metadata expects
        run: |
          mkdir -p target/release
          cp "target/${{ matrix.triple }}/release/piso-hotspot" target/release/piso-hotspot
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - name: Build packages
        run: |
          cargo deb --no-build --no-strip --output /tmp/piso-hotspot.deb
          cargo generate-rpm --output /tmp/piso-hotspot.rpm
      - name: Inspect .deb metadata
        run: |
          dpkg-deb -I /tmp/piso-hotspot.deb
          dpkg-deb -c /tmp/piso-hotspot.deb | grep -q 'usr/bin/piso-hotspot'
          dpkg-deb -I /tmp/piso-hotspot.deb | grep -qE '^ Depends: .*hostapd'
      - name: Inspect .rpm payload
        run: |
          # Slice at the payload's compression magic (rpm lead+headers
          # precede it; exact header arithmetic is format-version
          # dependent) and check the binary is inside.
          python3 - <<'PY'
          import sys, lzma
          data = open("/tmp/piso-hotspot.rpm", "rb").read()
          assert data[:4] == b"\xed\xab\xee\xdb", "not an rpm"
          i = data.find(b"\x28\xb5\x2f\xfd")  # zstd (generate-rpm default)
          if i >= 0:
              import subprocess
              p = subprocess.run(["zstd", "-dc"], input=data[i:],
                                 capture_output=True)
              if p.returncode != 0:
                  sys.exit(f"zstd decode failed: {p.stderr.decode()[:200]}")
              cpio = p.stdout
          else:
              j = data.find(b"\xfd7zXZ\x00")  # xz fallback
              if j < 0:
                  sys.exit("no zstd or xz payload stream found")
              cpio = lzma.decompress(data[j:])
          assert b"usr/bin/piso-hotspot" in cpio, "binary missing from payload"
          print(f".rpm payload ok ({len(cpio)} bytes)")
          PY
