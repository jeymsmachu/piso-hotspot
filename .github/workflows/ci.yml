name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked

  # Packaging is verified here (and published by release.yml) so a broken
  # Cargo.toml metadata block fails on the PR, not at release time.
  package:
    name: Package (${{ matrix.triple }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 keeps the glibc floor low for the x86-64 artifact.
          - runner: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.triple }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: package-${{ matrix.triple }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.triple }}
      - name: Provide the path package metadata expects
        run: |
          mkdir -p target/release
          cp "target/${{ matrix.triple }}/release/piso-hotspot" target/release/piso-hotspot
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - name: Build packages
        run: |
          cargo deb --no-build --no-strip --output /tmp/piso-hotspot.deb
          cargo generate-rpm --output /tmp/piso-hotspot.rpm
      - name: Inspect .deb metadata
        run: |
          dpkg-deb -I /tmp/piso-hotspot.deb
          dpkg-deb -c /tmp/piso-hotspot.deb | grep -q 'usr/bin/piso-hotspot'
          dpkg-deb -I /tmp/piso-hotspot.deb | grep -qE '^ Depends: .*hostapd'
      - name: Inspect .rpm payload
        run: |
          # Slice at the payload's compression magic (rpm lead+headers
          # precede it; exact header arithmetic is format-version
          # dependent) and check the binary is inside.
          python3 - <<'PY'
          import sys, lzma
          data = open("/tmp/piso-hotspot.rpm", "rb").read()
          assert data[:4] == b"\xed\xab\xee\xdb", "not an rpm"
          i = data.find(b"\x28\xb5\x2f\xfd")  # zstd (generate-rpm default)
          if i >= 0:
              import io, subprocess
              p = subprocess.run(["zstd", "-dc"], input=data[i:],
                                 capture_output=True)
              if p.returncode != 0:
                  sys.exit(f"zstd decode failed: {p.stderr.decode()[:200]}")
              cpio = p.stdout
          else:
              j = data.find(b"\xfd7zXZ\x00")  # xz fallback
              if j < 0:
                  sys.exit("no zstd or xz payload stream found")
              cpio = lzma.decompress(data[j:])
          assert b"usr/bin/piso-hotspot" in cpio, "binary missing from payload"
          print(f".rpm payload ok ({len(cpio)} bytes)")
          PY