[package]
name = "piso-hotspot"
version = "0.1.0"
edition = "2024"
description = "Pay-per-usage wifi hotspot"
repository = "https://github.com/jeymsmachu/piso-hotspot"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
libc = "0.2"
chrono = { version = "0.4", features = ["clock"], default-features = false }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync"] }
getrandom = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
